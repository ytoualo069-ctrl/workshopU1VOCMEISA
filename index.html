const AM={catalogue:"catalog",gage:"gauge",gages:"gauge",sulphide:"sulfide",polysulphide:"polysulfide",vapour:"vapor",aluminium:"aluminum"};
// normalise: lower case, no accents/punctuation, no articles, singular, words sorted (word order does not matter)
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-_\/,]/g," ").replace(/&/g," and ").replace(/[^a-z0-9 ]+/g," ").replace(/\bnon\s*conform/g,"non conform").split(/\s+/).filter(w=>w&&!SW.has(w)).map(w=>{w=AM[w]||w;return w.length>3&&w.endsWith("s")&&!w.endsWith("ss")?w.slice(0,-1):w}).sort().join(" ");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let x=1;x<=a.length;x++){let p=d[0];d[0]=x;for(let y=1;y<=b.length;y++){const t=d[y];d[y]=Math.min(d[y]+1,d[y-1]+1,p+(a[x-1]==b[y-1]?0:1));p=t}}return d[b.length]};
// accepted answers: full name, name without brackets, every alternative (/ & ,), the long form of an acronym, plus synonyms (SYN)
function acc(it){if(it.a)return it.a;const en=it.en,r=new Set(),b=en.replace(/\s*\([^)]*\)/g,"").trim(),m=en.match(/^(.*?)\s*\((.*)\)/);
r.add(norm(en));r.add(norm(b));b.split(/\s*(?:\/|&|,|\band\b|\bor\b)\s*/i).forEach(x=>x.trim()&&r.add(norm(x)));
if(m&&/^[A-Z]{2,}$/.test(m[1].trim()))r.add(norm(m[2]));
(SYN[it.p]||"").split("|").forEach(x=>x&&r.add(norm(x)));return it.a=[...r].filter(Boolean)}
// correct if: same words in any order, a 1-2 letter typo, or the answer contains all the words of an accepted multi-word name
const good=(g,it)=>{const s=norm(g);if(!s)return false;const st=s.split(" ");
return acc(it).some(a=>a==s||(a.length>=5&&lev(s,a)<=(a.length>=12?2:1))||(a.includes(" ")&&a.split(" ").every(w=>st.includes(w))))};
// text read aloud by the browser voice
const spoken=t=>{const m=t.match(/^([A-Z]{2,})\s*\((.*)\)/);let s=m?m[1]+", "+m[2]:t.replace(/\s*\([^)]*\)/g,"");
return s.replace(/In-lbs/g,"inch pounds").replace(/Ft-lbs/g,"foot pounds").replace(/\b(FAA|PSI|ESD|AMM|SRM|IPC|NCR|SOP|FOD|NDT|TQF|WO|FAL)\b/g,x=>x.split("").join(" ")).replace(/\s*&\s*/g," and ").replace(/\s*\/\s*/g,", ")};
function say(i,slow){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(items[i].en));u.lang=VOICE;u.rate=slow?.55:.9;speechSynthesis.speak(u)}
const pron=i=>'<div class="pr">🗣️ <b>'+items[i].pr+'</b></div><div class="row"><button onclick="say('+i+')">🔊 Listen</button><button onclick="say('+i+',1)">🐢 Slow</button></div>';
const KEY='<details class="key"><summary>How to read the pronunciation (cómo leerla)</summary><p>CAPITALS = stressed syllable (sílaba tónica) · ei = day · ai = my · ou = go · au = now · ii = see · iu = you · a = cat / cut · e = bed · j = aspirated h · sh = she · ch = chair · dy = job · zh = vision · th = think · w = water · r = soft. It is an approximation: press 🔊 to listen.</p></details>';
let tA=0;
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&Date.now()-tA>400){const b=$("#nx");if(b)b.click()}});
let M,q,k,lock,sc=[0,0];
const head=()=>'<h1>✈️ MEISA Technical Vocabulary</h1><div class="sub">Aircraft Structures Assembly &amp; Systems Installation</div>';
const img=p=>'<div class="imgbox"><img src="'+BASE+p+EXT+'" alt="" onerror="this.outerHTML=\'<div class=ph>✈️<br>Image coming soon</div>\'"></div>';
function study(n){const t=items[n];
app.innerHTML=head()+'<div class="card"><div class="cat">'+C[t.ci][0]+'</div>'+img(t.p)+'<div class="en">'+t.en+'</div><div class="es">'+t.es+'</div>'+pron(n)+KEY
+'<div class="bar"><i style="width:'+(n+1)/items.length*100+'%"></i></div><div class="sub">'+(n+1)+' / '+items.length+'</div>'
+'<div class="row">'+(n?'<button onclick="study('+(n-1)+')">← Back</button>':'')
+(n<items.length-1?'<button class="btn" onclick="study('+(n+1)+')">Next →</button>':'<button class="btn" onclick="intro(1)">Start the exercises ✏️</button>')+'</div>'
+'<div class="row"><select aria-label="Category" onchange="study(+this.value)">'+C.map((c,ci)=>'<option value="'+items.findIndex(x=>x.ci==ci)+'"'+(ci==t.ci?' selected':'')+'>'+c[0].split(" (")[0]+'</option>').join('')+'</select><button onclick="intro(1)">Skip to the exercises</button></div></div>'}
function intro(l){M=l;app.innerHTML=head()+'<div class="card"><div class="big">Level '+l+'</div><p>'+(l==1?'Look at the picture and choose the correct name.':'Look at the picture and type the name in English. Any correct name or synonym is accepted, and small typos are forgiven.')+'</p><p class="sub">'+N+' questions. When you fail, we show you the right answer.</p><div class="row"><button class="btn" onclick="run()">Start Level '+l+'</button></div></div>'}
function run(){q=shuf(items).slice(0,N);k=0;sc[M-1]=0;ask()}
function ask(){lock=0;const t=q[k];let b;
if(M==1){const d=shuf(items.filter(x=>x!=t&&x.ci==t.ci)).slice(0,3);while(d.length<3){const x=items[Math.random()*items.length|0];if(x!=t&&!d.includes(x))d.push(x)}
b=shuf(d.concat(t)).map(x=>'<button class="opt" onclick="pick(this,'+items.indexOf(x)+')">'+x.en+'</button>').join('')}
else b='<input type="text" id="a" placeholder="Type the name in English…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')chk()"><div class="row"><button class="btn" onclick="chk()">Check</button></div>';
app.innerHTML=head()+'<div class="card"><div class="sub">Level '+M+' · Question '+(k+1)+' of '+N+' · Score '+sc[M-1]+'</div><div class="bar"><i style="width:'+k/N*100+'%"></i></div>'+img(t.p)+b+'<div id="fb"></div></div>';
if(M==2)$("#a").focus()}
function pick(el,n){if(lock)return;lock=1;const r=items[n]===q[k];el.classList.add(r?'ok':'bad');
if(!r)document.querySelectorAll('.opt').forEach(o=>{if(o.textContent==q[k].en)o.classList.add('ok')});done(r)}
function chk(){if(lock)return;const a=$("#a");if(!a.value.trim())return;lock=1;a.disabled=true;done(good(a.value,q[k]))}
function done(r){const t=q[k],i=items.indexOf(t);tA=Date.now();if(r)sc[M-1]++;
$("#fb").innerHTML='<div class="fb '+(r?'ok':'bad')+'">'+(r?'✅ Correct! '+t.en:'❌ Not quite. The right answer is: '+t.en+' ('+t.es+')')+'</div>'+pron(i)+'<div class="row"><button class="btn" id="nx" onclick="nxt()">Next →</button></div>';
$("#nx").focus();if(!r)say(i)}
function nxt(){k++;if(k<N)ask();else if(M==1)intro(2);else result()}
function result(){const s=sc[0]+sc[1],T=2*N,p=Math.round(s/T*100);
const m=p>=90?['🏆','Outstanding! You master the MEISA vocabulary. Restart the app for a new random set of questions and try to keep your perfect level.']
:p>=70?['🚀','Great job! You are almost there. Restart the app and aim for a perfect score.']
:p>=50?['👍','Good effort! You know the basics. Study the slideshow again, restart the app and improve your level.']
:['📚','Keep going! Review the slideshow carefully and restart the app to improve your level. Every attempt makes you faster at the hangar.'];
app.innerHTML=head()+'<div class="card"><div class="big">'+m[0]+' '+s+' / '+T+'</div><p><b>'+p+'%</b></p><p class="sub">Level 1: '+sc[0]+' / '+N+' · Level 2: '+sc[1]+' / '+N+'</p><p>'+m[1]+'</p><div class="row"><button class="btn" onclick="sc=[0,0];study(0)">🔄 Restart the app</button></div></div>'}
study(0);
</script></body></html>
